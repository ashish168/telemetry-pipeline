<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="880" height="420" fill="#fbfaf8"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a3324"/>
    </marker>
    <style>
      .svc  { fill:#fff; stroke:#15161a; stroke-width:1.5; rx:6 }
      .topic{ fill:#f6efe9; stroke:#8a3324; stroke-width:1.2; rx:14 }
      .store{ fill:#fff; stroke:#777b86; stroke-width:1.2; stroke-dasharray:4 3; rx:6 }
      .t    { font-size:13px; font-weight:600; fill:#15161a }
      .s    { font-size:10.5px; fill:#5c5c61 }
      .tp   { font-size:11px; font-weight:600; fill:#8a3324; font-family:ui-monospace,Menlo,monospace }
      .ln   { stroke:#8a3324; stroke-width:1.4; fill:none; marker-end:url(#a) }
      .lnq  { stroke:#9a9aa2; stroke-width:1.1; fill:none; stroke-dasharray:3 3 }
      .hdr  { font-size:11px; font-weight:700; fill:#777b86; letter-spacing:.09em }
    </style>
  </defs>

  <text x="24" y="30" class="hdr">EVENT-DRIVEN TELEMETRY PIPELINE</text>

  <!-- devices -->
  <rect x="24" y="56" width="132" height="62" class="svc"/>
  <text x="38" y="80" class="t">Devices</text>
  <text x="38" y="98" class="s">HVAC · meters</text>
  <text x="38" y="112" class="s">simulated, 2 buildings</text>

  <path d="M156 87 L212 87" class="ln"/>
  <text x="162" y="80" class="s">HTTP</text>

  <!-- ingest -->
  <rect x="212" y="56" width="150" height="62" class="svc"/>
  <text x="226" y="80" class="t">Ingest</text>
  <text x="226" y="98" class="s">validate · persist</text>
  <text x="226" y="112" class="s">latency-sensitive</text>

  <path d="M287 118 L287 160" class="ln"/>

  <!-- readings topic -->
  <rect x="196" y="160" width="182" height="34" class="topic"/>
  <text x="212" y="182" class="tp">telemetry.readings</text>

  <path d="M287 194 L287 236" class="ln"/>

  <!-- detect -->
  <rect x="212" y="236" width="150" height="76" class="svc"/>
  <text x="226" y="260" class="t">Detect</text>
  <text x="226" y="278" class="s">windowed rules</text>
  <text x="226" y="292" class="s">+ periodic sweep</text>
  <text x="226" y="306" class="s">CPU-bound</text>

  <path d="M362 274 L432 274" class="ln"/>

  <!-- anomalies topic -->
  <rect x="432" y="257" width="190" height="34" class="topic"/>
  <text x="448" y="279" class="tp">telemetry.anomalies</text>

  <path d="M527 257 L527 194" class="ln"/>

  <!-- dispatch -->
  <rect x="452" y="118" width="150" height="76" class="svc"/>
  <text x="466" y="142" class="t">Dispatch</text>
  <text x="466" y="160" class="s">response policy</text>
  <text x="466" y="174" class="s">anomaly → action</text>

  <path d="M602 156 L672 156" class="ln"/>

  <!-- commands topic -->
  <rect x="672" y="139" width="184" height="34" class="topic"/>
  <text x="688" y="161" class="tp">telemetry.commands</text>

  <!-- mongo -->
  <rect x="672" y="257" width="184" height="62" class="store"/>
  <text x="688" y="281" class="t">MongoDB</text>
  <text x="688" y="299" class="s">readings · anomalies · commands</text>

  <path d="M362 90 C520 90 660 200 700 257" class="lnq"/>
  <path d="M362 290 L672 288" class="lnq"/>
  <path d="M602 180 C640 220 660 240 700 257" class="lnq"/>

  <!-- rules callout -->
  <rect x="24" y="236" width="150" height="104" class="store"/>
  <text x="38" y="260" class="t">rules.ts</text>
  <text x="38" y="278" class="s">pure · unit-tested</text>
  <text x="38" y="296" class="s">threshold breach</text>
  <text x="38" y="310" class="s">sensor drift</text>
  <text x="38" y="324" class="s">device silent</text>
  <path d="M174 288 L212 288" class="lnq"/>

  <text x="24" y="372" class="s">Solid arrows: event flow.  Dashed: persistence and pure-function dependency.</text>
  <text x="24" y="392" class="s">Ingest and detect are separate services because burst-tolerant I/O and windowed CPU work scale on different axes.</text>
</svg>
