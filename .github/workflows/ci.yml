name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: the detection rules are pure, so they need no infrastructure.
  unit:
    name: Types and detection rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The claim this repo makes is that the pipeline works end to end. CI proves
  # it on every push rather than asking anyone to take it on trust.
  e2e:
    name: Pipeline end to end
    runs-on: ubuntu-latest
    needs: unit
    env:
      # Detector timings compressed so a run takes a minute, not five.
      SILENCE_MS: 8000
      SWEEP_MS: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start Redpanda and MongoDB
        run: docker compose up -d --wait

      - name: Start services
        run: |
          npm run ingest   > /tmp/ingest.log   2>&1 &
          npm run detect   > /tmp/detect.log   2>&1 &
          npm run dispatch > /tmp/dispatch.log 2>&1 &
          sleep 5

      - name: End-to-end smoke test
        run: npm run e2e

      - name: Service logs
        if: always()
        run: |
          for s in ingest detect dispatch; do
            echo "::group::$s"; tail -60 /tmp/$s.log || true; echo "::endgroup::"
          done

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
